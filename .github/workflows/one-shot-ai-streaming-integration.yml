name: One-shot AI streaming integration

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ai-streaming-drafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact AI integration edits
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Enforce enabled/quota/request-cap on the generic pipeline too.
          path = Path('app/services/ai_generation.py')
          text = path.read_text()
          old = '''    async def run_pipeline(\n        self,\n        *,\n        channel_id: int,\n        mode: str,\n        topic: str = "",\n        original_text: str = "",\n        url: str = "",\n        instruction: str | None = None,\n        extra: dict | None = None,\n        user_id: int | None = None,\n        prompt_key: str | None = None,\n    ) -> dict:\n        ai_settings, model, system_prompt, user_prompt = await self.build_prompt(\n'''
          new = '''    async def run_pipeline(\n        self,\n        *,\n        channel_id: int,\n        mode: str,\n        topic: str = "",\n        original_text: str = "",\n        url: str = "",\n        instruction: str | None = None,\n        extra: dict | None = None,\n        user_id: int | None = None,\n        prompt_key: str | None = None,\n    ) -> dict:\n        guard_settings = await self.ai_repo.get_or_create(channel_id)\n        if not bool(getattr(guard_settings, "enabled", False)):\n            return {\n                "success": False,\n                "text": None,\n                "tokens_used": 0,\n                "error": "ИИ отключен для этого канала",\n            }\n        day_limit, month_limit, request_cap = await self._effective_limits(\n            guard_settings, channel_id\n        )\n        if day_limit is not None and int(guard_settings.tokens_used_day or 0) >= int(day_limit):\n            return {\n                "success": False,\n                "text": None,\n                "tokens_used": 0,\n                "error": "Превышен дневной лимит токенов",\n            }\n        if month_limit is not None and int(guard_settings.tokens_used_month or 0) >= int(month_limit):\n            return {\n                "success": False,\n                "text": None,\n                "tokens_used": 0,\n                "error": "Превышен месячный лимит токенов",\n            }\n\n        ai_settings, model, system_prompt, user_prompt = await self.build_prompt(\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          anchor = '''        res = await self.generate_with_model(\n            ai_settings=ai_settings,\n'''
          replacement = '''        ai_settings["max_tokens"] = min(\n            max(1, int(ai_settings.get("max_tokens") or 2000)),\n            max(1, int(request_cap)),\n        )\n        res = await self.generate_with_model(\n            ai_settings=ai_settings,\n'''
          assert text.count(anchor) == 1, text.count(anchor)
          text = text.replace(anchor, replacement, 1)
          path.write_text(text)

          # 2) Topic generation: native Telegram drafts + OpenRouter SSE.
          path = Path('app/bot/routers/main.py')
          text = path.read_text()
          old = '''    # Показываем индикатор генерации\n    status_msg = await message.answer("⏳ Генерирую текст...")\n\n    # Генерируем текст\n    async with AsyncSessionLocal() as session:\n        from app.services.ai_generation import AIGenerationService\n        from app.repositories.ai_settings import ChannelAISettingsRepo\n\n        # Гарантируем, что ИИ включен для канала при попытке генерации\n        try:\n            repo = ChannelAISettingsRepo(session)\n            await repo.update_enabled(channel_id, True)\n        except Exception:\n            pass\n        service = AIGenerationService(session)\n\n        # Собираем контекст\n        context = {\n            "brand": data.get("brand", ""),\n            "audience": data.get("audience", "подписчики канала"),\n            "cta": data.get("cta", ""),\n        }\n\n        result = await service.run_pipeline(\n            channel_id=channel_id,\n            mode="from_scratch",\n            topic=topic,\n            extra=context,\n            user_id=message.from_user.id,\n            prompt_key="ai_text",\n        )\n\n    # Удаляем статус\n    with suppress(TelegramBadRequest):\n        await status_msg.delete()\n'''
          new = '''    # Stream the model directly into Telegram's ephemeral draft preview.\n    async with AsyncSessionLocal() as session:\n        from app.bot.ai_draft_stream import render_ai_stream_to_draft\n        from app.repositories.ai_settings import ChannelAISettingsRepo\n        from app.services.ai_generation import AIGenerationService\n        from app.services.ai_streaming import InteractiveAIStreamingService\n\n        try:\n            repo = ChannelAISettingsRepo(session)\n            await repo.update_enabled(channel_id, True)\n        except Exception:\n            pass\n\n        generation = AIGenerationService(session)\n        streaming = InteractiveAIStreamingService(generation)\n        context = {\n            "brand": data.get("brand", ""),\n            "audience": data.get("audience", "подписчики канала"),\n            "cta": data.get("cta", ""),\n        }\n        result = await render_ai_stream_to_draft(\n            tg_bot,\n            chat_id=message.chat.id,\n            seed=message.message_id,\n            events=streaming.stream_pipeline(\n                channel_id=channel_id,\n                mode="from_scratch",\n                topic=topic,\n                extra=context,\n                user_id=message.from_user.id,\n                prompt_key="ai_text",\n            ),\n        )\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          # Preserve editor state when generation fails instead of clearing it.
          old = '''        await state.clear()\n        return\n\n    # Успешная генерация - обновляем payload поста\n'''
          new = '''        await state.set_state(PostFSM.preview)\n        return\n\n    # Успешная генерация - обновляем payload поста\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          # The result is already applied to payload; label the action accurately.
          old = 'text="Применить ответ →", callback_data="ai_back_to_preview"'
          new = 'text="← В редактор", callback_data="ai_back_to_preview"'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          # 3) Link generation must actually fetch/extract the article.
          old = '''            result = await service.run_pipeline(\n                channel_id=channel_id,\n                mode="from_link",\n                url=url,\n                extra={"link_mode": mode},\n                user_id=message.from_user.id,\n                prompt_key="ai_link",\n            )\n'''
          new = '''            result = await service.generate_from_link(\n                channel_id=channel_id,\n                url=url,\n                mode=mode,\n                user_id=message.from_user.id,\n                prompt_key="ai_link",\n            )\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          # 4) Improve actions use the same streaming renderer.
          old = '''    status_msg = await callback.message.answer("⏳ Улучшаю текст...")\n\n    try:\n        async with AsyncSessionLocal() as session:\n            service = AIGenerationService(session)\n            result = await service.run_pipeline(\n                channel_id=channel_id,\n                mode="improve",\n                original_text=current_text,\n                instruction=instruction,\n                user_id=callback.from_user.id,\n                prompt_key="ai_improve",\n            )\n            with suppress(TelegramBadRequest):\n                await status_msg.delete()\n\n'''
          new = '''    try:\n        async with AsyncSessionLocal() as session:\n            from app.bot.ai_draft_stream import render_ai_stream_to_draft\n            from app.services.ai_streaming import InteractiveAIStreamingService\n\n            generation = AIGenerationService(session)\n            streaming = InteractiveAIStreamingService(generation)\n            result = await render_ai_stream_to_draft(\n                tg_bot,\n                chat_id=callback.message.chat.id,\n                seed=callback.message.message_id,\n                events=streaming.stream_pipeline(\n                    channel_id=channel_id,\n                    mode="improve",\n                    original_text=current_text,\n                    instruction=instruction,\n                    user_id=callback.from_user.id,\n                    prompt_key="ai_improve",\n                ),\n            )\n\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''    except Exception as e:\n        logger.error(f"Ошибка при улучшении текста: {e}")\n        await status_msg.edit_text(f"❌ Произошла ошибка: {str(e)}")\n        await state.set_state(PostFSM.preview)\n'''
          new = '''    except Exception as e:\n        logger.error(f"Ошибка при улучшении текста: {e}")\n        await callback.message.answer(f"❌ Произошла ошибка: {str(e)}")\n        await state.set_state(PostFSM.preview)\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git rm .github/workflows/one-shot-ai-streaming-integration.yml
      - name: Commit exact changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ux stream interactive AI generation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
