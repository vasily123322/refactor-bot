name: Channel owner guard

on:
  pull_request:
    paths:
      - "app/core/settings_channel_access.py"
      - "app/bot/routers/__init__.py"
      - "tests/test_settings_channel_access.py"
      - ".github/workflows/channel-owner-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      API_ID: "123456"
      API_HASH: "0123456789abcdef0123456789abcdef"
      DB_URL: "sqlite+aiosqlite:///:memory:"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest aiosqlite
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run owner guard regression tests
        run: pytest -q tests/test_settings_channel_access.py
