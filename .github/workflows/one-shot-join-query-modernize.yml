name: One-shot join query modernization

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/join-request-queries'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact source edits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/services/join_requests.py')
          text = path.read_text()

          import_anchor = 'from app.repositories.subscribers import SubscribersRepo\n'
          import_block = (
              import_anchor
              + 'from app.services.join_query_decisions import (\n'
              + '    answer_join_query,\n'
              + '    resolve_immediate_join_decision,\n'
              + ')\n'
          )
          assert text.count(import_anchor) == 1
          text = text.replace(import_anchor, import_block, 1)

          checks = [
              'if (wl_u or wl_i) and not ((uname and uname in wl_u) or (user_id in wl_i)):',
              'if (uname and uname in bl_u) or (user_id in bl_i):',
              'if any(sw in fullname for sw in stopw):',
          ]
          for check in checks:
              old = check + '\n            await self.session.add('
              new = (
                  check
                  + '\n            if not await resolve_immediate_join_decision(event, "decline"):\n'
                  + '                return\n'
                  + '            await self.session.add('
              )
              assert text.count(old) == 1, (check, text.count(old))
              text = text.replace(old, new, 1)

          mode_anchor = '        # Mode 0 (auto) with optional DM requirement\n'
          queue_block = (
              '        # Bot API 10.1 query processors must answer within 10 seconds.\n'
              '        # Challenges/manual moderation stay pending after an explicit queue result.\n'
              '        if (mode != 0 or require_mode != 0) and getattr(event, "query_id", None):\n'
              '            await answer_join_query(event, "queue")\n\n'
              + mode_anchor
          )
          assert text.count(mode_anchor) == 1
          text = text.replace(mode_anchor, queue_block, 1)

          approve_old = '''            with suppress(Exception):\n                await event.bot.approve_chat_join_request(\n                    chat_id=chat_id, user_id=user_id\n                )\n            await self._write_modlog(ch.id, "approve", user_id, {"mode": "auto"})\n'''
          approve_new = '''            if not await resolve_immediate_join_decision(event, "approve"):\n                return\n            await self._write_modlog(ch.id, "approve", user_id, {"mode": "auto"})\n'''
          assert text.count(approve_old) == 1, text.count(approve_old)
          text = text.replace(approve_old, approve_new, 1)

          path.write_text(text)
          PY
          git rm .github/workflows/one-shot-join-query-modernize.yml
      - name: Commit exact changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'modernize join request query decisions'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
