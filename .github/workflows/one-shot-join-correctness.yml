name: One-shot join correctness edit

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/join-flow-correctness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact source edits
        run: |
          python - <<'PY'
          from pathlib import Path

          shared = Path('app/bot/routers/shared_join.py')
          text = shared.read_text()
          old = '@router.message(F.text)\n    async def on_dm_text'
          new = '@router.message(F.text, ~F.text.startswith("/"))\n    async def on_dm_text'
          assert text.count(old) == 1, text.count(old)
          shared.write_text(text.replace(old, new, 1))

          service = Path('app/services/join_requests.py')
          text = service.read_text()
          ctor = '''    def __init__(self, bot: Bot, session: AsyncSession):\n        self.bot = bot\n        self.session = session\n\n'''
          helper = '''    def __init__(self, bot: Bot, session: AsyncSession):\n        self.bot = bot\n        self.session = session\n\n    @staticmethod\n    def _build_challenge_payload(require_mode: int) -> dict | None:\n        if int(require_mode) != 2:\n            return None\n        import random\n\n        a = random.randint(2, 9)\n        b = random.randint(2, 9)\n        return {"a": a, "b": b, "answer": str(a + b)}\n\n'''
          assert text.count(ctor) == 1, text.count(ctor)
          text = text.replace(ctor, helper, 1)
          marker = '# DM is OK and challenge required: create pending and send DM'
          start = text.index(marker)
          target = 'challenge_payload=None,'
          pos = text.index(target, start)
          next_marker = text.find('# Mode 1 or 2', start)
          assert next_marker == -1 or pos < next_marker
          text = text[:pos] + 'challenge_payload=self._build_challenge_payload(require_mode),' + text[pos + len(target):]
          service.write_text(text)
          PY
          git rm .github/workflows/one-shot-join-correctness.yml
      - name: Commit exact changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/bot/routers/shared_join.py app/services/join_requests.py .github/workflows/one-shot-join-correctness.yml
          git diff --cached --check
          git commit -m 'fix join routing and captcha payload'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
