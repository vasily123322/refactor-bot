name: One-shot AI result actions integration

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ai-result-actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact editor AI edits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/bot/routers/main.py')
          text = path.read_text()

          # Topic: central runtime + remember request for retry.
          old = '''        from app.bot.ai_draft_stream import render_ai_stream_to_draft\n        from app.repositories.ai_settings import ChannelAISettingsRepo\n        from app.services.ai_generation import AIGenerationService\n        from app.services.ai_streaming import InteractiveAIStreamingService\n'''
          new = '''        from app.bot.ai_editor_runtime import run_editor_ai_request\n        from app.repositories.ai_settings import ChannelAISettingsRepo\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''        generation = AIGenerationService(session)\n        streaming = InteractiveAIStreamingService(generation)\n        context = {\n            "brand": data.get("brand", ""),\n            "audience": data.get("audience", "подписчики канала"),\n            "cta": data.get("cta", ""),\n        }\n        result = await render_ai_stream_to_draft(\n            tg_bot,\n            chat_id=message.chat.id,\n            seed=message.message_id,\n            events=streaming.stream_pipeline(\n                channel_id=channel_id,\n                mode="from_scratch",\n                topic=topic,\n                extra=context,\n                user_id=message.from_user.id,\n                prompt_key="ai_text",\n            ),\n        )\n'''
          new = '''        context = {\n            "brand": data.get("brand", ""),\n            "audience": data.get("audience", "подписчики канала"),\n            "cta": data.get("cta", ""),\n        }\n        request = {\n            "kind": "topic",\n            "topic": topic,\n            "extra": context,\n            "prompt_key": "ai_text",\n        }\n        await state.update_data(ai_last_request=request)\n        result = await run_editor_ai_request(\n            tg_bot,\n            session=session,\n            request=request,\n            channel_id=channel_id,\n            user_id=message.from_user.id,\n            chat_id=message.chat.id,\n            seed=message.message_id,\n        )\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''    # Кнопка «Применить ответ →» для быстрого возврата в редактор уже совершена вставкой выше,\n    # поэтому просто дадим кнопку возврата к карточке создания\n    kb_back = InlineKeyboardMarkup(\n        inline_keyboard=[\n            [\n                InlineKeyboardButton(\n                    text="← В редактор", callback_data="ai_back_to_preview"\n                )\n            ]\n        ]\n    )\n    success_text = f"✅ Текст сгенерирован!\\nИспользовано токенов: {tokens_used}"\n    await message.answer(success_text, reply_markup=kb_back)\n'''
          new = '''    from app.bot.ai_editor_runtime import ai_result_actions_kb, ai_result_summary\n\n    await message.answer(\n        ai_result_summary(result, label="Текст сгенерирован"),\n        reply_markup=ai_result_actions_kb(),\n    )\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          # Link: use the same live streaming runtime and remember URL/mode.
          old = '''    status_msg = await message.answer("⏳ Загружаю статью и генерирую текст...")\n\n    try:\n        async with AsyncSessionLocal() as session:\n            service = AIGenerationService(session)\n            mode = (data.get("ai_link_mode") or "summary").lower().strip()\n            if mode not in {"summary", "rewrite", "paraphrase"}:\n                mode = "summary"\n            result = await service.generate_from_link(\n                channel_id=channel_id,\n                url=url,\n                mode=mode,\n                user_id=message.from_user.id,\n                prompt_key="ai_link",\n            )\n            with suppress(TelegramBadRequest):\n                await status_msg.delete()\n'''
          new = '''    mode = (data.get("ai_link_mode") or "summary").lower().strip()\n    if mode not in {"summary", "rewrite", "paraphrase"}:\n        mode = "summary"\n    request = {\n        "kind": "link",\n        "url": url,\n        "mode": mode,\n        "prompt_key": "ai_link",\n    }\n    await state.update_data(ai_last_request=request)\n\n    try:\n        async with AsyncSessionLocal() as session:\n            from app.bot.ai_editor_runtime import run_editor_ai_request\n\n            result = await run_editor_ai_request(\n                tg_bot,\n                session=session,\n                request=request,\n                channel_id=channel_id,\n                user_id=message.from_user.id,\n                chat_id=message.chat.id,\n                seed=message.message_id,\n            )\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''        await message.answer(\n            f"✅ {mode_done} готов!\\nИспользовано токенов: {tokens_used}"\n        )\n'''
          new = '''        from app.bot.ai_editor_runtime import ai_result_actions_kb, ai_result_summary\n\n        await message.answer(\n            ai_result_summary(result, label=f"{mode_done} готов"),\n            reply_markup=ai_result_actions_kb(),\n        )\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''    except Exception as e:\n        logger.error(f"Ошибка при генерации из ссылки: {e}")\n        await status_msg.edit_text(f"❌ Произошла ошибка: {str(e)}")\n        await state.set_state(PostFSM.preview)\n'''
          new = '''    except Exception as e:\n        logger.error(f"Ошибка при генерации из ссылки: {e}")\n        await message.answer(f"❌ Произошла ошибка: {str(e)}")\n        await state.set_state(PostFSM.preview)\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          # Improve: fix callback parsing and remember original request for variants.
          old = '    action = callback.data.split("_")[-1]\n'
          new = '''    from app.bot.ai_editor_runtime import improve_action_name\n\n    action = improve_action_name(callback.data)\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '    if action == "tone":\n'
          new = '    if action == "tone_menu":\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''        async with AsyncSessionLocal() as session:\n            from app.bot.ai_draft_stream import render_ai_stream_to_draft\n            from app.services.ai_streaming import InteractiveAIStreamingService\n\n            generation = AIGenerationService(session)\n            streaming = InteractiveAIStreamingService(generation)\n            result = await render_ai_stream_to_draft(\n                tg_bot,\n                chat_id=callback.message.chat.id,\n                seed=callback.message.message_id,\n                events=streaming.stream_pipeline(\n                    channel_id=channel_id,\n                    mode="improve",\n                    original_text=current_text,\n                    instruction=instruction,\n                    user_id=callback.from_user.id,\n                    prompt_key="ai_improve",\n                ),\n            )\n'''
          new = '''        request = {\n            "kind": "improve",\n            "original_text": current_text,\n            "instruction": instruction,\n            "prompt_key": "ai_improve",\n        }\n        await state.update_data(ai_last_request=request)\n        async with AsyncSessionLocal() as session:\n            from app.bot.ai_editor_runtime import run_editor_ai_request\n\n            result = await run_editor_ai_request(\n                tg_bot,\n                session=session,\n                request=request,\n                channel_id=channel_id,\n                user_id=callback.from_user.id,\n                chat_id=callback.message.chat.id,\n                seed=callback.message.message_id,\n            )\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''        await callback.message.answer(\n            f"✅ Текст улучшен!\\nИспользовано токенов: {tokens_used}"\n        )\n'''
          new = '''        from app.bot.ai_editor_runtime import ai_result_actions_kb, ai_result_summary\n\n        await callback.message.answer(\n            ai_result_summary(result, label="Текст улучшен"),\n            reply_markup=ai_result_actions_kb(),\n        )\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git rm .github/workflows/one-shot-ai-result-actions.yml
      - name: Commit exact changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ux add AI result actions and retry context'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
