name: Patch canonical editor back

on:
  push:
    branches:
      - agent/canonical-content-plan-publication-callback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/canonical-content-plan-publication-callback
      - name: Apply exact canonical back/time fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          editor = Path("app/bot/routers/post_editor.py")
          text = editor.read_text(encoding="utf-8")
          anchor = '''    prev_restore = data_all_top.get("prev_editor_restore")\n    if isinstance(prev_restore, dict) and prev_restore.get("type") == "cp_card":\n'''
          replacement = '''    prev_restore = data_all_top.get("prev_editor_restore")\n    if (\n        isinstance(prev_restore, dict)\n        and prev_restore.get("type") == "cp_publication_card"\n    ):\n        try:\n            from app.bot.routers.content_plan_publications import (\n                cb_cp_open_publication,\n            )\n\n            publication_id = int(prev_restore.get("publication_id"))\n            d = str(prev_restore.get("date"))\n            cb2 = callback.model_copy(\n                update={"data": f"cp_open_publication:{publication_id}:{d}"}\n            )  # type: ignore\n            await cb_cp_open_publication(cb2, state)\n            with suppress(TelegramBadRequest):\n                await callback.answer()\n            with suppress(Exception):\n                await state.update_data(prev_editor_restore=None)\n            return True\n        except Exception:\n            pass\n    if isinstance(prev_restore, dict) and prev_restore.get("type") == "cp_card":\n'''
          count = text.count(anchor)
          if count != 2:
              raise SystemExit(f"expected two cp_card restore anchors, got {count}")
          text = text.replace(anchor, replacement)
          editor.write_text(text, encoding="utf-8")

          router = Path("app/bot/routers/content_plan_publications.py")
          text = router.read_text(encoding="utf-8")
          old_import = '''from app.services.content_plan_publications import (\n    OwnedPublicationContext,\n    load_owned_publication_context,\n)\n'''
          new_import = '''from app.services.content_plan_publications import (\n    OwnedPublicationContext,\n    load_owned_publication_context,\n)\nfrom app.services.scheduling import as_utc\n'''
          if text.count(old_import) != 1:
              raise SystemExit(f"expected one canonical service import, got {text.count(old_import)}")
          text = text.replace(old_import, new_import, 1)
          old_time = '''    value = ctx.scheduled_at\n    try:\n        if ctx.timezone_name:\n            value = value.astimezone(ZoneInfo(ctx.timezone_name))\n'''
          new_time = '''    value = as_utc(ctx.scheduled_at)\n    try:\n        if ctx.timezone_name:\n            value = value.astimezone(ZoneInfo(ctx.timezone_name))\n'''
          if text.count(old_time) != 1:
              raise SystemExit(f"expected one local-time block, got {text.count(old_time)}")
          text = text.replace(old_time, new_time, 1)
          router.write_text(text, encoding="utf-8")

          Path(".github/workflows/patch-canonical-editor-back.yml").unlink()
          PY
      - name: Commit canonical back/time fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/routers/post_editor.py app/bot/routers/content_plan_publications.py .github/workflows/patch-canonical-editor-back.yml
          git commit -m "fix: restore canonical content-plan editor back path"
          git push origin HEAD:agent/canonical-content-plan-publication-callback
