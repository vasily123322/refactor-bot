name: Patch canonical publication edit integration

on:
  push:
    branches:
      - agent/canonical-publication-edit-integration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/canonical-publication-edit-integration
      - name: Wire canonical edit before legacy edit path
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/bot/routers/posting_publish.py")
          text = path.read_text(encoding="utf-8")
          old = '''        payload: dict = dict(data.get("payload") or {})\n        prev_id = data.get("preview_msg_id")\n        try:\n'''
          new = '''        payload: dict = dict(data.get("payload") or {})\n        prev_id = data.get("preview_msg_id")\n        if isinstance(data.get("canonical_edit_context"), dict):\n            from app.bot.routers.utils.canonical_publication_edit import (\n                handle_canonical_publication_edit,\n            )\n\n            await handle_canonical_publication_edit(\n                callback,\n                state,\n                data=data,\n                payload=payload,\n            )\n            return\n        try:\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one edit anchor, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/patch-canonical-publication-edit-integration.yml").unlink()
          PY
      - name: Commit integration patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/routers/posting_publish.py .github/workflows/patch-canonical-publication-edit-integration.yml
          git commit -m "feat: route canonical edits through truthful persistence"
          git push origin HEAD:agent/canonical-publication-edit-integration
