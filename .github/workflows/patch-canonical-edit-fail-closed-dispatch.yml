name: Patch canonical edit fail-closed dispatch

on:
  push:
    branches:
      - agent/canonical-publication-edit-integration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/canonical-publication-edit-integration
      - name: Move canonical dispatch above legacy edit guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/bot/routers/posting_publish.py")
          text = path.read_text(encoding="utf-8")
          old = '''    edit_chat_id = data.get("edit_chat_id")\n    edit_msg_id = data.get("edit_msg_id")\n    if edit_chat_id and edit_msg_id and not bool(data.get("is_draft", False)):\n        payload: dict = dict(data.get("payload") or {})\n        prev_id = data.get("preview_msg_id")\n        if isinstance(data.get("canonical_edit_context"), dict):\n            from app.bot.routers.utils.canonical_publication_edit import (\n                handle_canonical_publication_edit,\n            )\n\n            await handle_canonical_publication_edit(\n                callback,\n                state,\n                data=data,\n                payload=payload,\n            )\n            return\n        try:\n'''
          new = '''    edit_chat_id = data.get("edit_chat_id")\n    edit_msg_id = data.get("edit_msg_id")\n    if isinstance(data.get("canonical_edit_context"), dict):\n        from app.bot.routers.utils.canonical_publication_edit import (\n            handle_canonical_publication_edit,\n        )\n\n        await handle_canonical_publication_edit(\n            callback,\n            state,\n            data=data,\n            payload=dict(data.get("payload") or {}),\n        )\n        return\n    if edit_chat_id and edit_msg_id and not bool(data.get("is_draft", False)):\n        payload: dict = dict(data.get("payload") or {})\n        prev_id = data.get("preview_msg_id")\n        try:\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one canonical edit dispatch block, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          helper = Path("app/bot/routers/utils/canonical_publication_edit.py")
          helper_text = helper.read_text(encoding="utf-8")
          old_log = '''        logger.warning(\n            "Canonical publication edit sync failed conflict={}",\n            exc.conflict,\n        )\n'''
          new_log = '''        logger.warning(\n            "Canonical publication edit sync failed conflict={} error_type={}",\n            exc.conflict,\n            exc.error_type,\n        )\n'''
          if helper_text.count(old_log) != 1:
              raise SystemExit(f"expected one sync log block, got {helper_text.count(old_log)}")
          helper.write_text(helper_text.replace(old_log, new_log, 1), encoding="utf-8")

          Path(".github/workflows/patch-canonical-edit-fail-closed-dispatch.yml").unlink()
          PY
      - name: Commit fail-closed dispatch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/routers/posting_publish.py app/bot/routers/utils/canonical_publication_edit.py .github/workflows/patch-canonical-edit-fail-closed-dispatch.yml
          git commit -m "fix: route canonical edit context fail closed"
          git push origin HEAD:agent/canonical-publication-edit-integration
