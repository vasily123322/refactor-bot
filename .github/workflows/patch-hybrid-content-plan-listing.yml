name: Patch hybrid content-plan published listing

on:
  push:
    branches:
      - agent/hybrid-content-plan-published-listing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/hybrid-content-plan-published-listing
      - name: Add canonical-only published rows to legacy day list
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/bot/routers/content_plan.py")
          text = path.read_text(encoding="utf-8")

          old_rows = '''    post_rows = []\n    try:\n'''
          new_rows = '''    post_rows = []\n    try:\n        from app.bot.routers.utils.content_plan_hybrid import (\n            TimedContentPlanButtonRow,\n            canonical_published_button_row,\n            merge_timed_content_plan_rows,\n        )\n        from app.services.content_plan_published_rows import (\n            list_published_content_plan_rows,\n        )\n        from app.services.scheduling import as_utc\n\n        timed_post_rows: list[TimedContentPlanButtonRow] = []\n'''
          if text.count(old_rows) != 1:
              raise SystemExit(f"expected one post_rows anchor, got {text.count(old_rows)}")
          text = text.replace(old_rows, new_rows, 1)

          old_append = '''                post_rows.append(row_btns)\n    except Exception:\n        pass\n'''
          new_append = '''                timed_post_rows.append(\n                    TimedContentPlanButtonRow(\n                        scheduled_at=as_utc(p.scheduled_at),\n                        buttons=row_btns,\n                    )\n                )\n\n            canonical_timed_rows: list[TimedContentPlanButtonRow] = []\n            try:\n                canonical_rows = await list_published_content_plan_rows(\n                    session,\n                    channel_id=int(channel_id),\n                    start_at=start,\n                    end_at=end,\n                )\n                date_iso = center_date.date().isoformat()\n                for canonical_row in canonical_rows:\n                    rendered = canonical_published_button_row(\n                        canonical_row,\n                        date_iso=date_iso,\n                        tz_code=tz_code,\n                    )\n                    if rendered is not None:\n                        canonical_timed_rows.append(rendered)\n            except Exception:\n                # Canonical listing is a migration enhancement. Read failures must\n                # preserve the proven legacy PostTask list rather than blank the day.\n                canonical_timed_rows = []\n\n            post_rows = merge_timed_content_plan_rows(\n                timed_post_rows,\n                canonical_timed_rows,\n            )\n    except Exception:\n        pass\n'''
          if text.count(old_append) != 1:
              raise SystemExit(f"expected one legacy row append anchor, got {text.count(old_append)}")
          text = text.replace(old_append, new_append, 1)
          path.write_text(text, encoding="utf-8")

          Path(".github/workflows/patch-hybrid-content-plan-listing.yml").unlink()
          PY
      - name: Commit hybrid listing integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/routers/content_plan.py .github/workflows/patch-hybrid-content-plan-listing.yml
          git commit -m "feat: include canonical-only published content-plan rows"
          git push origin HEAD:agent/hybrid-content-plan-published-listing
