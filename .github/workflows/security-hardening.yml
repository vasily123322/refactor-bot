name: Security hardening

on:
  pull_request:
    paths:
      - "app/core/channel_access.py"
      - "app/core/url_security.py"
      - "app/repositories/ai_settings.py"
      - "app/repositories/conversations.py"
      - "app/services/http/fetcher.py"
      - "tests/test_security_hardening.py"
      - "requirements.txt"
      - ".github/workflows/security-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      API_ID: "123456"
      API_HASH: "0123456789abcdef0123456789abcdef"
      DB_URL: "sqlite+aiosqlite:///:memory:"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Run security regression tests
        run: pytest -q tests/test_security_hardening.py
