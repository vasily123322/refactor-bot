name: One-shot AI editor router extraction

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  extract:
    if: github.event.pull_request.head.ref == 'agent/ai-editor-router'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract AI editor handlers
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('app/bot/routers/main.py')
          text = main_path.read_text()
          start_marker = '# --- Обработчики кнопки ИИ в редакторе постов ---\n'
          end_marker = '# Заглушка для пока не реализованных кнопок редактора\n'
          assert text.count(start_marker) == 1, text.count(start_marker)
          assert text.count(end_marker) == 1, text.count(end_marker)
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end].rstrip() + '\n'
          assert '@router.callback_query(F.data == CB.POST_AI)' in block
          assert '@router.message(PostFSM.ai_topic_input)' in block
          assert '@router.message(PostFSM.ai_link_input)' in block
          assert '@router.callback_query(F.data.startswith("ai_improve_"))' in block

          imports = '''from __future__ import annotations\n\nfrom contextlib import suppress\n\nfrom aiogram import F, Router\nfrom aiogram.exceptions import TelegramBadRequest\nfrom aiogram.fsm.context import FSMContext\nfrom aiogram.types import CallbackQuery, InlineKeyboardButton, InlineKeyboardMarkup, Message\nfrom loguru import logger\n\nfrom app.bot.bot_instance import bot as tg_bot\nfrom app.bot.fsm.states import PostFSM\nfrom app.core.callbacks import CB\nfrom app.core.db import AsyncSessionLocal\n\n# Preview helpers stay in main during the first extraction step. main is imported\n# before this module by routers/__init__.py, so this does not create a cycle.\nfrom app.bot.routers.main import (\n    _build_preview_kb,\n    _build_pro_upsell_kb,\n    _log_ai_limit_to_admin,\n    _safe_edit_reply_markup,\n    _send_preview_message,\n)\n\n\nrouter = Router()\nrouter.message.filter(F.chat.type == "private")\nrouter.callback_query.filter(F.message.chat.type == "private")\n\n\n'''
          Path('app/bot/routers/ai_editor.py').write_text(imports + block)
          main_path.write_text(text[:start] + '# AI editor handlers moved to routers/ai_editor.py\n\n' + text[end:])

          init_path = Path('app/bot/routers/__init__.py')
          init_text = init_path.read_text()
          import_anchor = 'from .main import router as main_commands\n'
          assert init_text.count(import_anchor) == 1
          init_text = init_text.replace(
              import_anchor,
              import_anchor + 'from .ai_editor import router as ai_editor_commands\n',
              1,
          )
          include_anchor = 'main_router.include_router(ai_result_actions_commands)\n'
          assert init_text.count(include_anchor) == 1
          init_text = init_text.replace(
              include_anchor,
              'main_router.include_router(ai_editor_commands)\n' + include_anchor,
              1,
          )
          init_path.write_text(init_text)
          PY
          ruff check app tests scripts
          python -m compileall -q app tests scripts
          git rm .github/workflows/one-shot-ai-editor-extract.yml
      - name: Commit extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor extract AI editor router'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
