name: Patch canonical content-plan review fixes

on:
  push:
    branches:
      - agent/canonical-content-plan-publication-callback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/canonical-content-plan-publication-callback
      - name: Apply exact review fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/bot/routers/content_plan_publications.py")
          text = path.read_text(encoding="utf-8")

          old_import = "from datetime import datetime, timedelta\n"
          new_import = "from datetime import datetime\n"
          if text.count(old_import) != 1:
              raise SystemExit(f"expected one datetime import, got {text.count(old_import)}")
          text = text.replace(old_import, new_import, 1)

          old_state = '''        return_to_notice={\n            "publication_id": ctx.publication_id,\n            "post_id": ctx.legacy_post_task_id,\n            "date": date_iso,\n        },\n'''
          new_state = '''        return_to_notice=(\n            {\n                "publication_id": ctx.publication_id,\n                "post_id": ctx.legacy_post_task_id,\n                "date": date_iso,\n            }\n            if ctx.legacy_post_task_id is not None\n            else {"publication_id": ctx.publication_id, "date": date_iso}\n        ),\n'''
          if text.count(old_state) != 1:
              raise SystemExit(f"expected one editor notice block, got {text.count(old_state)}")
          text = text.replace(old_state, new_state, 1)
          path.write_text(text, encoding="utf-8")

          Path(".github/workflows/patch-canonical-content-plan-review-fixes.yml").unlink()
          PY
      - name: Commit review fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/routers/content_plan_publications.py .github/workflows/patch-canonical-content-plan-review-fixes.yml
          git commit -m "fix: harden canonical content-plan editor state"
          git push origin HEAD:agent/canonical-content-plan-publication-callback
