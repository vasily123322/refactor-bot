name: Cleanup branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all branches except main and v0
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_V0: v0/code-audit-and-improvement-recommendations-7e00ce93
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          keep = {"main", os.environ["KEEP_V0"]}
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "refactor-bot-branch-cleanup",
          }

          def get_branches():
              names = []
              page = 1
              while True:
                  url = f"https://api.github.com/repos/{repo}/branches?per_page=100&page={page}"
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req) as response:
                      batch = json.load(response)
                  names.extend(item["name"] for item in batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return names

          before = get_branches()
          missing_keep = keep - set(before)
          if missing_keep:
              print(f"Refusing cleanup; keep branches missing: {sorted(missing_keep)}")
              sys.exit(2)

          targets = sorted(set(before) - keep)
          print(f"Found {len(before)} branches; deleting {len(targets)} and keeping {sorted(keep)}")
          failures = []
          for index, name in enumerate(targets, 1):
              ref = urllib.parse.quote(f"heads/{name}", safe="/")
              url = f"https://api.github.com/repos/{repo}/git/refs/{ref}"
              req = urllib.request.Request(url, headers=headers, method="DELETE")
              try:
                  with urllib.request.urlopen(req) as response:
                      status = response.status
                  if status != 204:
                      failures.append((name, status, "unexpected status"))
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")[:500]
                  failures.append((name, exc.code, body))
              if index % 50 == 0 or index == len(targets):
                  print(f"Processed {index}/{len(targets)}")

          remaining = set(get_branches())
          unexpected = sorted(remaining - keep)
          missing_after = sorted(keep - remaining)
          print(f"Remaining branches: {sorted(remaining)}")
          if failures:
              print(f"Delete failures ({len(failures)}):")
              for failure in failures:
                  print(failure)
          if failures or unexpected or missing_after:
              if unexpected:
                  print(f"Unexpected remaining branches: {unexpected}")
              if missing_after:
                  print(f"Required branches missing after cleanup: {missing_after}")
              sys.exit(1)
          PY
