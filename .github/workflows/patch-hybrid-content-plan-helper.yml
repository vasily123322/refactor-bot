name: Patch testable hybrid content-plan helper

on:
  push:
    branches:
      - agent/hybrid-content-plan-published-listing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/hybrid-content-plan-published-listing
      - name: Route canonical listing through fail-soft helper
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/bot/routers/content_plan.py")
          text = path.read_text(encoding="utf-8")

          old_imports = '''        from app.bot.routers.utils.content_plan_hybrid import (\n            TimedContentPlanButtonRow,\n            canonical_published_button_row,\n            merge_timed_content_plan_rows,\n        )\n        from app.services.content_plan_published_rows import (\n            list_published_content_plan_rows,\n        )\n'''
          new_imports = '''        from app.bot.routers.utils.content_plan_hybrid import (\n            TimedContentPlanButtonRow,\n            canonical_only_published_button_rows,\n            merge_timed_content_plan_rows,\n        )\n'''
          if text.count(old_imports) != 1:
              raise SystemExit(f"expected one hybrid import block, got {text.count(old_imports)}")
          text = text.replace(old_imports, new_imports, 1)

          old_block = '''            canonical_timed_rows: list[TimedContentPlanButtonRow] = []\n            try:\n                canonical_rows = await list_published_content_plan_rows(\n                    session,\n                    channel_id=int(channel_id),\n                    start_at=start,\n                    end_at=end,\n                )\n                date_iso = center_date.date().isoformat()\n                for canonical_row in canonical_rows:\n                    rendered = canonical_published_button_row(\n                        canonical_row,\n                        date_iso=date_iso,\n                        tz_code=tz_code,\n                    )\n                    if rendered is not None:\n                        canonical_timed_rows.append(rendered)\n            except Exception:\n                # Canonical listing is a migration enhancement. Read failures must\n                # preserve the proven legacy PostTask list rather than blank the day.\n                canonical_timed_rows = []\n\n'''
          new_block = '''            canonical_timed_rows = await canonical_only_published_button_rows(\n                session,\n                channel_id=int(channel_id),\n                start_at=start,\n                end_at=end,\n                date_iso=center_date.date().isoformat(),\n                tz_code=tz_code,\n            )\n\n'''
          if text.count(old_block) != 1:
              raise SystemExit(f"expected one canonical hybrid query block, got {text.count(old_block)}")
          text = text.replace(old_block, new_block, 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/patch-hybrid-content-plan-helper.yml").unlink()
          PY
      - name: Commit fail-soft helper wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/routers/content_plan.py .github/workflows/patch-hybrid-content-plan-helper.yml
          git commit -m "refactor: route hybrid listing through fail-soft helper"
          git push origin HEAD:agent/hybrid-content-plan-published-listing
