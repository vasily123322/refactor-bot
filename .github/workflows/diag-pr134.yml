name: PR 134 pytest diagnostics

on:
  push:
    branches:
      - agent/canonical-edit-autodelete-sync

permissions:
  contents: read

jobs:
  python-312-diagnostic:
    runs-on: ubuntu-24.04
    env:
      BOT_TOKEN: 123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi
      API_ID: 123456
      API_HASH: 0123456789abcdef0123456789abcdef
      DB_URL: sqlite+aiosqlite:///:memory:
      DB_SECRET_KEY: ci-only-database-secret-key-0123456789abcdef
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run full test suite with diagnostics
        id: pytest
        shell: bash
        run: |
          set +e
          pytest -q --tb=short --junitxml=pr134-junit.xml > pr134-pytest.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr134-pytest-diagnostics
          path: |
            pr134-junit.xml
            pr134-pytest.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failing status
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1
