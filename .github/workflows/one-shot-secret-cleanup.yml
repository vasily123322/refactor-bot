name: One-shot secret cleanup

on:
  push:
    branches:
      - agent/secret-scan-ci

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/secret-scan-ci
      - name: Remove external bot token from admin message source
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/bot/routers/settings.py")
          text = path.read_text(encoding="utf-8")
          old = '''                # Добавим сам токен в лог, как просили
          text_log = f"пользователь {user_html} добавил бот {bot_html} с токеном: <code>{token}</code> в канал\\nКанал/чат: "'''
          new = '''                text_log = f"пользователь {user_html} добавил бот {bot_html} в канал\\nКанал/чат: "'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one legacy token-log block, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit minimal cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/routers/settings.py
          git diff --cached --check
          git commit -m "security: remove token from admin notification source"
          git push origin HEAD:agent/secret-scan-ci
