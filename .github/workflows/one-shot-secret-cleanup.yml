name: One-shot secret cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/secret-scan-ci
      - name: Remove external bot token from admin message source
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/bot/routers/settings.py")
          text = path.read_text(encoding="utf-8")
          comment = "                # Добавим сам токен в лог, как просили\n"
          secret_fragment = "с токеном: <code>{token}</code> "
          if text.count(comment) != 1:
              raise SystemExit("expected exactly one legacy token-log comment")
          if text.count(secret_fragment) != 1:
              raise SystemExit("expected exactly one legacy token interpolation")
          text = text.replace(comment, "", 1)
          text = text.replace(secret_fragment, "", 1)
          path.write_text(text, encoding="utf-8")
      - name: Commit minimal cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/routers/settings.py
          git diff --cached --check
          git commit -m "security: remove token from admin notification source"
          git push origin HEAD:agent/secret-scan-ci
