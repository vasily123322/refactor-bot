name: Patch content-plan delete error

on:
  push:
    branches:
      - agent/content-plan-callback-ownership

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/content-plan-callback-ownership
      - name: Replace raw delete exception response
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/bot/routers/content_plan.py")
          text = path.read_text(encoding="utf-8")
          old = '''        except Exception as e:\n            return await callback.answer(f"Не удалось удалить: {e}", show_alert=True)\n'''
          new = '''        except Exception:\n            return await callback.answer("Не удалось удалить", show_alert=True)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one raw delete error path, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/patch-content-plan-delete-error.yml").unlink()
          PY
      - name: Commit safe delete error
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/routers/content_plan.py .github/workflows/patch-content-plan-delete-error.yml
          git commit -m "fix: redact content-plan delete failures"
          git push origin HEAD:agent/content-plan-callback-ownership
