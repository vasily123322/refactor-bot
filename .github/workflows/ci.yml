name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      API_ID: "123456"
      API_HASH: "0123456789abcdef0123456789abcdef"
      DB_URL: "sqlite+aiosqlite:///:memory:"
      DB_SECRET_KEY: "ci-only-database-secret-key-0123456789abcdef"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Scan tracked files for secrets
        run: python scripts/secret_scan.py
      - name: Ruff correctness gate
        run: ruff check app tests scripts
      - name: Compile Python sources
        run: python -m compileall -q app tests scripts
      - name: Run full test suite
        run: |
          set +e
          pytest -q --tb=no > /tmp/pytest.log 2>&1
          status=$?
          echo "=== pytest failure manifest ==="
          grep -E '^(FAILED|ERROR) ' /tmp/pytest.log || true
          echo "=== pytest summary ==="
          tail -n 8 /tmp/pytest.log
          exit "$status"

  studio:
    name: Telegram Studio frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Studio dependencies
        working-directory: studio
        run: npm install --no-audit --no-fund
      - name: Test Studio adapters
        working-directory: studio
        run: npm run test
      - name: Build Studio
        working-directory: studio
        run: npm run build