name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      API_ID: "123456"
      API_HASH: "0123456789abcdef0123456789abcdef"
      DB_URL: "sqlite+aiosqlite:///:memory:"
      DB_SECRET_KEY: "ci-only-database-secret-key-0123456789abcdef"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Scan tracked files for secrets
        run: python scripts/secret_scan.py
      - name: Ruff correctness gate
        run: ruff check app tests scripts
      - name: Compile Python sources
        run: python -m compileall -q app tests scripts
      - name: Run stabilization regression gate
        run: |
          pytest -q \
            tests/test_admin_agent.py \
            tests/test_admin_agent_drafts.py \
            tests/test_admin_agent_content_series.py \
            tests/test_admin_agent_approvals.py \
            tests/test_admin_agent_series_approvals.py \
            tests/test_admin_agent_resumable.py \
            tests/test_admin_agent_automations.py \
            tests/test_admin_agent_migration.py \
            tests/test_studio_admin_agent_automation_api.py \
            tests/test_studio_admin_agent_api.py \
            tests/test_studio_admin_agent_content_series_api.py \
            tests/test_studio_admin_agent_approval_api.py \
            tests/test_studio_admin_agent_series_approval_api.py \
            tests/test_studio_admin_agent_resume_api.py \
            tests/test_ai_activity.py \
            tests/test_ai_run_lease_recovery.py \
            tests/test_ai_run_retention.py \
            tests/test_candidate_current_structured_rewrite.py \
            tests/test_candidate_drafts.py \
            tests/test_candidate_enrichment.py \
            tests/test_candidate_enrichment_batch.py \
            tests/test_candidate_enrichment_races.py \
            tests/test_candidate_prompt_structured_rewrite.py \
            tests/test_candidate_rewrite.py \
            tests/test_candidate_rewrite_safety.py \
            tests/test_candidate_structured_edit.py \
            tests/test_canonical_scheduling_boundary_persistence.py \
            tests/test_p7_legacy_runtime_cutover.py \
            tests/test_canonical_publication_delivery_runtime_capability.py \
            tests/test_canonical_mixed_delivery_runtime.py \
            tests/test_canonical_mixed_autodelete.py \
            tests/test_publication_autodelete.py \
            tests/test_publication_autodelete_worker.py \
            tests/test_content_plan_p3_cutover.py \
            tests/test_channel_dm_replies.py \
            tests/test_channel_dm_reply_global_idempotency.py \
            tests/test_channel_dm_reply_intents.py \
            tests/test_local_enrichment_worker.py \
            tests/test_alembic_baseline.py \
            tests/test_posttask_schema_drop.py \
            tests/test_p8_zero_production_refs.py \
            tests/test_schema_startup.py \
            tests/test_source_media_promotion.py \
            tests/test_source_reconciliation.py \
            tests/test_studio_ai_activity_api.py \
            tests/test_studio_candidate_draft_api.py \
            tests/test_studio_candidate_enrichment_api.py \
            tests/test_studio_candidate_media.py \
            tests/test_studio_candidate_rewrite_api.py \
            tests/test_studio_channel_onboarding_request_concurrency.py \
            tests/test_studio_channel_onboarding_requests.py \
            tests/test_studio_sources_inbox_api.py \
            tests/test_suggested_post_actions.py \
            tests/test_telegram_channel_dms.py \
            tests/test_telegram_source_ingestion.py
      - name: Report historical test debt
        continue-on-error: true
        run: |
          set +e
          pytest -q --tb=no \
            --ignore-glob='tests/test_*legacy*.py' \
            --ignore-glob='tests/test_*retirement*.py' \
            --ignore-glob='tests/test_*handoff*.py' \
            --ignore-glob='tests/test_*parity*.py' \
            --ignore-glob='tests/test_*shadow*.py' \
            > /tmp/pytest.log 2>&1
          status=$?
          echo "=== historical pytest failure manifest (non-blocking) ==="
          grep -E '^(FAILED|ERROR) ' /tmp/pytest.log || true
          echo "=== historical pytest summary ==="
          tail -n 8 /tmp/pytest.log
          exit "$status"

  studio:
    name: Telegram Studio frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Studio dependencies
        working-directory: studio
        run: npm ci --no-audit --no-fund
      - name: Test Studio adapters
        working-directory: studio
        run: npm run test
      - name: Build Studio
        working-directory: studio
        run: npm run build
