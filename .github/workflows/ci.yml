name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      API_ID: "123456"
      API_HASH: "0123456789abcdef0123456789abcdef"
      DB_URL: "sqlite+aiosqlite:///:memory:"
      DB_SECRET_KEY: "ci-only-database-secret-key-0123456789abcdef"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Scan tracked files for secrets
        run: python scripts/secret_scan.py
      - name: Ruff correctness gate
        run: ruff check app tests scripts
      - name: Compile Python sources
        run: python -m compileall -q app tests scripts
      - name: Run full test suite with diagnostics
        id: pytest
        shell: bash
        run: |
          set +e
          pytest -q --tb=short --junitxml="pytest-${{ matrix.python-version }}.xml" > "pytest-${{ matrix.python-version }}.txt" 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python-version }}-diagnostics
          path: |
            pytest-${{ matrix.python-version }}.xml
            pytest-${{ matrix.python-version }}.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve pytest failure
        if: steps.pytest.outputs.exit_code != '0'
        run: exit 1

  studio:
    name: Telegram Studio frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Studio dependencies
        working-directory: studio
        run: npm install --no-audit --no-fund
      - name: Test Studio adapters
        working-directory: studio
        run: npm run test
      - name: Build Studio
        working-directory: studio
        run: npm run build
