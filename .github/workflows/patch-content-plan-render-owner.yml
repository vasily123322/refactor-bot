name: Patch content-plan render ownership guard

on:
  push:
    branches:
      - agent/content-plan-callback-ownership

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/content-plan-callback-ownership
      - name: Add exact render ownership guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/bot/routers/content_plan.py")
          text = path.read_text(encoding="utf-8")
          old = '''    from app.domain.models import Channel, PostTask\n\n    async with AsyncSessionLocal() as session:\n        # Определим часовой пояс канала и границы суток в этом поясе\n'''
          new = '''    from app.domain.models import Channel, Client, PostTask\n\n    async with AsyncSessionLocal() as session:\n        owner_match = (\n            await session.execute(\n                select(Channel.id)\n                .join(Client, Client.id == Channel.owner_id)\n                .where(\n                    Channel.id == int(channel_id),\n                    Client.tg_user_id == int(callback.from_user.id),\n                )\n            )\n        ).scalar_one_or_none()\n        if owner_match is None:\n            await callback.answer("Нет доступа к этому каналу", show_alert=True)\n            return\n        # Определим часовой пояс канала и границы суток в этом поясе\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one render anchor, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/patch-content-plan-render-owner.yml").unlink()
          PY
      - name: Commit render ownership guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/routers/content_plan.py .github/workflows/patch-content-plan-render-owner.yml
          git commit -m "fix: guard content-plan rendering by owner"
          git push origin HEAD:agent/content-plan-callback-ownership
