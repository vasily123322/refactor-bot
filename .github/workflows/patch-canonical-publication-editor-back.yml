name: Patch canonical publication editor back

on:
  push:
    branches:
      - agent/canonical-publication-editor-back

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/canonical-publication-editor-back
      - name: Add canonical publication restore before legacy restore
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/bot/routers/post_editor.py")
          text = path.read_text(encoding="utf-8")
          anchor = '''    prev_restore = data_all_top.get("prev_editor_restore")\n    if isinstance(prev_restore, dict) and prev_restore.get("type") == "cp_card":\n'''
          replacement = '''    prev_restore = data_all_top.get("prev_editor_restore")\n    if (\n        isinstance(prev_restore, dict)\n        and prev_restore.get("type") == "cp_publication_card"\n    ):\n        try:\n            from app.bot.routers.content_plan_publication import (\n                cb_cp_open_publication,\n            )\n\n            publication_id = int(prev_restore.get("publication_id"))\n            d = str(prev_restore.get("date"))\n            cb2 = callback.model_copy(\n                update={"data": f"cp_open_pub:{publication_id}:{d}"}\n            )  # type: ignore\n            await cb_cp_open_publication(cb2, state)\n            with suppress(TelegramBadRequest):\n                await callback.answer()\n            with suppress(Exception):\n                await state.update_data(prev_editor_restore=None)\n            return True\n        except Exception:\n            pass\n    if isinstance(prev_restore, dict) and prev_restore.get("type") == "cp_card":\n'''
          count = text.count(anchor)
          if count != 2:
              raise SystemExit(f"expected two legacy restore anchors, got {count}")
          path.write_text(text.replace(anchor, replacement), encoding="utf-8")
          Path(".github/workflows/patch-canonical-publication-editor-back.yml").unlink()
          PY
      - name: Commit canonical editor back path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/bot/routers/post_editor.py .github/workflows/patch-canonical-publication-editor-back.yml
          git commit -m "feat: restore canonical publication editor cards"
          git push origin HEAD:agent/canonical-publication-editor-back
