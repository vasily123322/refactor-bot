name: Studio lockfile refresh

on:
  pull_request:
    paths:
      - studio/package.json
      - studio/package-lock.json
      - .github/workflows/studio-lockfile-temp.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Refresh lockfile
        working-directory: studio
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile when changed
        run: |
          if git diff --quiet -- studio/package-lock.json; then
            echo "Studio lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/package-lock.json
          git commit -m "chore(studio): synchronize package lockfile"
          git push origin HEAD:${{ github.head_ref }}
