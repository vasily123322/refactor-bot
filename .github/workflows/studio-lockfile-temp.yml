name: Stabilization fixture refresh

on:
  pull_request:
    paths:
      - studio/package.json
      - studio/package-lock.json
      - tests/test_channel_dm_reply_intents.py
      - tests/test_suggested_post_actions.py
      - tests/test_telegram_channel_dms.py
      - .github/workflows/studio-lockfile-temp.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Refresh Studio lockfile
        working-directory: studio
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh aiogram fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "tests/test_channel_dm_reply_intents.py",
              "tests/test_telegram_channel_dms.py",
          ):
              path = Path(name)
              text = path.read_text()
              old = 'payload["edit_date"] = edit_date'
              new = 'payload["edit_date"] = int(edit_date.timestamp())'
              if old in text:
                  text = text.replace(old, new)
                  path.write_text(text)

          path = Path("tests/test_suggested_post_actions.py")
          text = path.read_text()
          old = '''            "suggested_post_approved": {\n                "suggested_post_message": original.model_dump('''
          new = '''            "suggested_post_approved": {\n                "send_date": int(datetime(2026, 8, 18, 1, tzinfo=timezone.utc).timestamp()),\n                "suggested_post_message": original.model_dump('''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Commit generated fixes when changed
        run: |
          if git diff --quiet -- studio/package-lock.json tests/test_channel_dm_reply_intents.py tests/test_suggested_post_actions.py tests/test_telegram_channel_dms.py; then
            echo "Generated files already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/package-lock.json tests/test_channel_dm_reply_intents.py tests/test_suggested_post_actions.py tests/test_telegram_channel_dms.py
          git commit -m "test: refresh Bot API fixture payloads"
          git push origin HEAD:${{ github.head_ref }}
