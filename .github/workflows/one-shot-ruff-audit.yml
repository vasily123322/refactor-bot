name: One-shot Ruff safe fixes

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/ruff-quality-gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.16.0
      - name: Apply safe Ruff fixes
        run: |
          ruff check app tests scripts --fix || true
          python - <<'PY'
          from pathlib import Path

          path = Path('app/bot/routers/main.py')
          text = path.read_text()
          target = '        tokens_used = result.get("tokens_used", 0)\n'
          assert text.count(target) == 2, text.count(target)
          text = text.replace(target, '')
          target = '    tokens_used = result.get("tokens_used", 0)\n'
          assert text.count(target) == 1, text.count(target)
          text = text.replace(target, '', 1)
          path.write_text(text)

          path = Path('app/services/llm/ai_debug_screen.py')
          text = path.read_text()
          target = '    memory_text = "\\n".join(memory_lines)\n\n'
          assert text.count(target) == 1, text.count(target)
          path.write_text(text.replace(target, '', 1))
          PY
          ruff check app tests scripts --output-format concise
          git rm .github/workflows/one-shot-ruff-audit.yml
      - name: Commit safe fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'quality apply safe Ruff fixes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
