name: Reconcile canonical autodelete branch

on:
  push:
    branches:
      - agent/canonical-publication-autodelete-operation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/canonical-publication-autodelete-operation
      - name: Verify deterministic branch state
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path("app/services/publication_autodelete.py")
          service_text = service.read_text(encoding="utf-8")
          required = [
              "def _safe_nonrepeat(schedule: ScheduleEntry) -> bool:",
              "deleted_flag not in (None, False, True)",
              "report_flag not in (None, False, True)",
              "raw_views not in (None, False, 0, \"0\", \"\")",
          ]
          missing = [value for value in required if value not in service_text]
          if missing:
              raise SystemExit(f"strict metadata guards missing: {missing}")

          tests = Path("tests/test_publication_autodelete.py")
          test_text = tests.read_text(encoding="utf-8")
          marker = "def test_ambiguous_metadata_fails_closed_without_provider_calls"
          if marker not in test_text:
              raise SystemExit("ambiguous metadata regression missing")

          for name in (
              ".github/workflows/patch-autodelete-strict-metadata.yml",
              ".github/workflows/patch-autodelete-metadata-test.yml",
              ".github/workflows/reconcile-autodelete-branch.yml",
          ):
              Path(name).unlink(missing_ok=True)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: finalize canonical autodelete branch"
          git push origin HEAD:agent/canonical-publication-autodelete-operation
