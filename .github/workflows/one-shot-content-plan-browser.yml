name: One-shot content plan browser edits

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/content-plan-browser'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact content-plan edits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/bot/routers/content_plan.py')
          text = path.read_text()

          anchor = 'from app.bot.keyboards.posting import settings_menu_kb\n'
          addition = anchor + 'from app.bot.keyboards.pagination import paginate, page_nav_row\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, addition, 1)

          old = '    kb = InlineKeyboardMarkup(inline_keyboard=rows)\n'
          new = '''    rows.append(\n        [InlineKeyboardButton(text="← Главное меню", callback_data=CB.GM_GLOBAL_MENU)]\n    )\n    kb = InlineKeyboardMarkup(inline_keyboard=rows)\n'''
          # Only replace the channel-list keyboard, which is the first occurrence.
          assert text.count(old) >= 1
          text = text.replace(old, new, 1)

          old = '''    # Ограничим размер клавиатуры, чтобы избежать "reply markup is too long"\n    max_rows = 40\n    info_row = None\n    try:\n        if len(post_rows) > max_rows:\n            info_row = [\n                InlineKeyboardButton(\n                    text=f"Показаны {max_rows} из {len(post_rows)}",\n                    callback_data="cp_day_center_nop",\n                )\n            ]\n            post_rows = post_rows[:max_rows]\n    except Exception:\n        pass\n'''
          new = '''    # Compact mobile browser: keep a bounded keyboard and page through the day.\n    try:\n        paging_state = await state.get_data()\n        requested_page = int(paging_state.get("cp_page", 0) or 0)\n    except Exception:\n        requested_page = 0\n    post_rows, safe_page, total_pages = paginate(\n        post_rows, requested_page, page_size=8\n    )\n    if safe_page != requested_page:\n        await state.update_data(cp_page=safe_page)\n    page_nav = page_nav_row(\n        prefix="cp_page",\n        page=safe_page,\n        total_pages=total_pages,\n        noop_callback="cp_day_center_nop",\n    )\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''    rows_all = [[open_cal], [btn_toggle]]\n    if post_rows:\n        rows_all.extend(post_rows)\n    if info_row:\n        rows_all.append(info_row)\n    rows_all.extend([[left, center_btn, right], [back]])\n'''
          new = '''    new_post = InlineKeyboardButton(\n        text="✍️ Новый пост", callback_data=f"{CB.POST_PICK_CH_PREFIX}{channel_id}"\n    )\n    home = InlineKeyboardButton(text="🏠 Главное меню", callback_data=CB.GM_GLOBAL_MENU)\n    rows_all = [[new_post], [open_cal], [btn_toggle]]\n    if post_rows:\n        rows_all.extend(post_rows)\n    if page_nav:\n        rows_all.append(page_nav)\n    rows_all.extend([[left, center_btn, right], [back, home]])\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''@router.callback_query(F.data == "cp_day_center_nop")\nasync def cb_cp_day_center_nop(callback: CallbackQuery):\n    # Ничего не делаем, просто закрываем спиннер\n    await callback.answer()\n\n\n'''
          new = old + '''@router.callback_query(F.data.startswith("cp_page:"))\nasync def cb_cp_page(callback: CallbackQuery, state: FSMContext):\n    try:\n        page = max(0, int(callback.data.split(":", 1)[1]))\n        data = await state.get_data()\n        cid = int(data.get("cp_channel_id") or 0)\n        center_iso = data.get("cp_center")\n        if not cid or not center_iso:\n            return await callback.answer("Откройте контент-план заново", show_alert=True)\n        center = datetime.fromisoformat(str(center_iso))\n    except Exception:\n        return await callback.answer("Ошибка страницы", show_alert=False)\n    await state.update_data(cp_page=page)\n    await _render_content_plan(callback, state, cid, center)\n    await callback.answer()\n\n\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '        await state.update_data(cp_show_repeats=(not show))\n'
          new = '        await state.update_data(cp_show_repeats=(not show), cp_page=0)\n'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '    await state.update_data(cp_channel_id=cid, cp_center=center.date().isoformat())\n'
          new = '    await state.update_data(cp_channel_id=cid, cp_center=center.date().isoformat(), cp_page=0)\n'
          assert text.count(old) == 2, text.count(old)
          text = text.replace(old, new)

          path.write_text(text)
          PY
          git rm .github/workflows/one-shot-content-plan-browser.yml
      - name: Commit exact changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'ux content plan pagination browser'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
