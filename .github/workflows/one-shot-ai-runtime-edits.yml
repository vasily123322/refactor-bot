name: One-shot AI runtime exact edits

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ai-runtime-modernization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply exact AI service edits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/services/ai_generation.py')
          text = path.read_text()

          old = '''            return await self.conv_repo.delete_by_user_and_prompt_key(\n                user_id=user_id, prompt_key=prompt_key\n            )\n'''
          new = '''            return await self.conv_repo.delete_by_user_and_prompt_key(\n                user_id=user_id,\n                prompt_key=prompt_key,\n                channel_id=channel_id,\n            )\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          old = '''                    content=result.get("text") or "",\n                    tokens=0,\n'''
          count = text.count(old)
          assert count == 3, count
          new = '''                    content=result.get("text") or "",\n                    tokens=int(result.get("completion_tokens", 0) or 0),\n'''
          text = text.replace(old, new)

          old = '''                    conv_id, role="assistant", content=answer, tokens=0\n'''
          new = '''                    conv_id,\n                    role="assistant",\n                    content=answer,\n                    tokens=int(result.get("completion_tokens", 0) or 0),\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git rm .github/workflows/one-shot-ai-runtime-edits.yml
      - name: Commit exact changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix AI history usage accounting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
