[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Explicit selection is intentional. Ruff 0.16 enables a much larger default
# ruleset; the first repository-wide gate focuses on Python correctness and
# import/syntax hazards without turning this PR into a style rewrite.
select = ["E4", "E7", "E9", "F"]

# A small group of legacy retirement tests intentionally use compact one-line
# fixtures. Keep correctness checks enabled repository-wide while avoiding a
# style-only rewrite of those tests during CI stabilization. Unused imports in
# tests are also deferred to the dedicated cleanup pass; production code keeps
# the full selected rule set.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E701", "E702", "F401"]
